name: Publier le planning

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Vérifier les modules et le catalogue
        run: npm run check

      - name: Vérifier les règles du planning
        run: npm test

      - name: Préparer le site
        run: npm run build

      - name: Publier app sur pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: pages
          publish_dir: ./app